<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3Dtest — Viewer</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0b0c10;
      overflow: hidden;
    }
    canvas { display:block; }
    #status{
      position: fixed;
      left: 12px;
      top: 12px;
      color: #fff;
      background: rgba(0,0,0,.5);
      padding: 8px 12px;
      border-radius: 8px;
      font: 12px system-ui;
      z-index: 10;
    }
  </style>
</head>
<body>
<div id="status">Boot…</div>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";
import { GLTFLoader } from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

const status = document.getElementById("status");
const MODEL_URL = "./arcadeforweb-compressed.glb";

// --- SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0c10);

// --- CAMERA (aggressively safe)
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.001, 10000);
camera.position.set(0, 1, 3);

// --- RENDERER
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
document.body.appendChild(renderer.domElement);

// --- LIGHTS (VERY strong on purpose)
scene.add(new THREE.AmbientLight(0xffffff, 1.2));

const dir = new THREE.DirectionalLight(0xffffff, 3);
dir.position.set(5, 10, 5);
scene.add(dir);

// --- GRID (to see scale)
scene.add(new THREE.GridHelper(10, 10));

// --- CONTROLS
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// --- LOAD MODEL
const loader = new GLTFLoader();
loader.load(
  MODEL_URL,
  (gltf) => {
    status.textContent = "Model loaded";

    const model = gltf.scene;

    // 🔴 FAILSAFE: force scale + position
    model.scale.setScalar(1);
    model.position.set(0, 0, 0);

    // 🔴 FAILSAFE: override materials if needed
    model.traverse((obj) => {
      if (obj.isMesh) {
        obj.material = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          roughness: 0.4,
          metalness: 0.1
        });
        obj.castShadow = true;
        obj.receiveShadow = true;
      }
    });

    scene.add(model);

    // Center camera to model bounds
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    model.position.sub(center);

    const maxDim = Math.max(size.x, size.y, size.z);
    camera.position.set(0, maxDim * 0.6, maxDim * 1.6);
    camera.lookAt(0, 0, 0);

    status.textContent = "Visible ✅";
  },
  undefined,
  (err) => {
    console.error(err);
    status.textContent = "Load failed ❌";
  }
);

// --- RESIZE
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// --- LOOP
(function animate(){
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>

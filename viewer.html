<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3Dtest — Viewer</title>
  <style>
    html, body { height: 100%; margin: 0; background: #0b0c10; overflow: hidden; }
    canvas { display:block; }
    #status{
      position: fixed; left: 12px; top: 12px; right: 12px;
      color: rgba(255,255,255,.92);
      background: rgba(0,0,0,.45);
      padding: 10px 12px; border-radius: 12px;
      font: 12px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial;
      backdrop-filter: blur(8px);
      white-space: pre-wrap;
      z-index: 9999;
    }
    .hint{
      position: fixed; left: 12px; bottom: 12px;
      color: rgba(255,255,255,.72);
      background: rgba(0,0,0,.35);
      padding: 10px 12px; border-radius: 12px;
      font: 12px/1.35 system-ui, -apple-system, Segoe UI, Roboto, Arial;
      backdrop-filter: blur(8px);
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="status">Boot…</div>
  <div class="hint">Drag = rotate · Scroll = zoom · Right-drag = pan</div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";
    import { GLTFLoader } from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

    const status = document.getElementById("status");

    // ✅ Malli repon rootissa
    const MODEL_URL = "./arcadeforweb-compressed.glb";

    // muodostetaan absoluuttinen debug-URL
    const modelAbs = new URL(MODEL_URL, location.href).toString();
    status.textContent = "Boot ✅\nLoading model:\n" + modelAbs;

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.01, 2000);
    camera.position.set(1.2, 0.9, 1.6);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.15));
    const key = new THREE.DirectionalLight(0xffffff, 1.6);
    key.position.set(3, 4, 2);
    scene.add(key);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;

    const loader = new GLTFLoader();
    loader.load(
      MODEL_URL,
      (gltf) => {
        status.textContent = "Loaded ✅";
        const model = gltf.scene;
        scene.add(model);

        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        model.position.sub(center);

        const maxDim = Math.max(size.x, size.y, size.z);
        const fitDist = maxDim / (2 * Math.tan((camera.fov * Math.PI) / 360));
        camera.position.set(0, maxDim * 0.15, fitDist * 1.25);
        camera.near = Math.max(0.01, fitDist / 200);
        camera.far  = fitDist * 200;
        camera.updateProjectionMatrix();

        controls.target.set(0, 0, 0);
        controls.update();

        setTimeout(() => status.remove(), 1000);
      },
      (xhr) => {
        if (xhr && xhr.total) {
          const p = (xhr.loaded / xhr.total) * 100;
          status.textContent = "Loading… " + p.toFixed(0) + "%\n" + modelAbs;
        } else {
          status.textContent = "Loading…\n" + modelAbs;
        }
      },
      async (err) => {
        console.error(err);
        status.textContent =
          "Load failed ❌\n\n" +
          "Testaa tämä URL suoraan selaimessa:\n" + modelAbs + "\n\n" +
          "Jos se antaa 404 → tiedoston nimi/polku väärin.\n" +
          "Jos se latautuu → MIME/response ongelma.\n\n" +
          (err?.message || String(err));
      }
    );

    addEventListener("resize", () => {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    (function animate(){
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3Dtest — Viewer</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0b0c10;
      overflow: hidden;
    }
    canvas { display: block; }
    .hint {
      position: fixed;
      left: 12px;
      bottom: 12px;
      color: rgba(255,255,255,.75);
      background: rgba(0,0,0,.4);
      padding: 8px 10px;
      border-radius: 10px;
      font: 12px system-ui, -apple-system, Segoe UI, Roboto;
    }
  </style>
</head>
<body>
  <div class="hint">Drag = rotate · Scroll = zoom</div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";
    import { GLTFLoader } from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

    // TÄRKEÄ: malli samassa repossa
    const MODEL_URL = "./arcadeforweb-compressed.glb";

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.01,
      100
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.1));
    const light = new THREE.DirectionalLight(0xffffff, 1.4);
    light.position.set(3, 4, 2);
    scene.add(light);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const loader = new GLTFLoader();
    loader.load(
      MODEL_URL,
      (gltf) => {
        const model = gltf.scene;
        scene.add(model);

        // Keskitys
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        model.position.sub(center);

        const maxDim = Math.max(size.x, size.y, size.z);
        const fitDist = maxDim / (2 * Math.tan((camera.fov * Math.PI) / 360));
        camera.position.set(0, maxDim * 0.15, fitDist * 1.25);

        controls.target.set(0, 0, 0);
        controls.update();
      },
      undefined,
      (error) => {
        alert("GLB ei latautunut. Tarkista tiedoston nimi.");
        console.error(error);
      }
    );

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>

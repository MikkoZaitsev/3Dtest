<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3Dtest — Viewer</title>
  <style>
    html, body { height:100%; margin:0; background:#0b0c10; overflow:hidden; }
    canvas { display:block; }
    #status{
      position:fixed; left:12px; top:12px; right:12px;
      color:#fff; background:rgba(0,0,0,.5);
      padding:10px 12px; border-radius:10px;
      font:12px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial;
      white-space:pre-wrap;
      z-index:9999;
    }
    .hint{
      position:fixed; left:12px; bottom:12px;
      color:rgba(255,255,255,.75); background:rgba(0,0,0,.35);
      padding:10px 12px; border-radius:10px;
      font:12px/1.35 system-ui, -apple-system, Segoe UI, Roboto, Arial;
      z-index:9999;
      pointer-events:none;
    }
  </style>

  <!-- ✅ NON-MODULE three + examples (same version) -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="status">Boot…</div>
  <div class="hint">Drag = rotate · Scroll = zoom · Right-drag = pan</div>

  <script>
    const status = document.getElementById("status");
    const MODEL_URL = "./arcadeforweb-compressed.glb";
    const modelAbs = new URL(MODEL_URL, location.href).toString();

    status.textContent = "Boot ✅\nLoading model:\n" + modelAbs;

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0c10);

    // Camera
    const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.001, 10000);
    camera.position.set(0, 1, 3);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding; // legacy
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    document.body.appendChild(renderer.domElement);

    // Lights (strong)
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const dir = new THREE.DirectionalLight(0xffffff, 3);
    dir.position.set(5,10,5);
    scene.add(dir);

    // Grid helper (should ALWAYS show if render loop runs)
    scene.add(new THREE.GridHelper(10, 10));

    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;

    // Loader
    const loader = new THREE.GLTFLoader();
    loader.load(
      MODEL_URL,
      (gltf) => {
        const model = gltf.scene;

        // Force visible material (failsafe)
        model.traverse((o) => {
          if (o.isMesh) {
            o.material = new THREE.MeshStandardMaterial({
              color: 0xffffff, roughness: 0.4, metalness: 0.1
            });
          }
        });

        scene.add(model);

        // Center model
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        model.position.sub(center);

        const maxDim = Math.max(size.x, size.y, size.z);
        camera.position.set(0, maxDim * 0.6, maxDim * 1.6);
        camera.lookAt(0,0,0);
        controls.target.set(0,0,0);
        controls.update();

        status.textContent = "Visible ✅";
        setTimeout(() => status.remove(), 900);
      },
      (xhr) => {
        if (xhr && xhr.total) {
          status.textContent = `Loading… ${Math.round(xhr.loaded/xhr.total*100)}%\n${modelAbs}`;
        }
      },
      (err) => {
        console.error(err);
        status.textContent = "Load failed ❌\n\n" + String(err);
      }
    );

    addEventListener("resize", () => {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    (function animate(){
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
